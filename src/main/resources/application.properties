spring.application.name=devaiAgent

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devaiagent}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devaiagent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devaiagent}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.storage.temp-directory=${APP_STORAGE_TEMP_DIRECTORY:./storage/tmp}
app.storage.delivery-directory=${APP_STORAGE_DELIVERY_DIRECTORY:./storage/delivery}

app.ai.provider=${AI_PROVIDER:gemini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.ai.max-tokens-per-project=${AI_MAX_TOKENS_PER_PROJECT:50000}

app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.cih.enabled=${CIH_ENABLED:false}
app.cih.api-key=${CIH_API_KEY:}

management.endpoints.web.exposure.include=health,info,metrics
